<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>클래스 보이스 - 수업 피드백</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface-hover: #22222e;
    --card: #1e1e28;
    --card-hover: #252533;
    --border: #2a2a38;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --green: #00b894;
    --green-dim: rgba(0,206,201,0.13);
    --orange: #fdcb6e;
    --orange-dim: rgba(253,203,110,0.13);
    --red: #e17055;
    --red-dim: rgba(225,112,85,0.13);
    --text: #e8e6e3;
    --text-sec: #8b8b9e;
    --text-muted: #5a5a72;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
  @keyframes countUp { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
  .fade-up { animation:fadeUp .4s ease-out both; }
  .slide-in { animation:slideIn .3s ease-out both; }
  .count-up { animation:countUp .3s ease-out both; }

  .app { max-width:560px; margin:0 auto; padding:0 16px 100px; }
  .center-screen {
    min-height:100vh; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:28px; padding:24px;
  }
  button {
    cursor:pointer; border:none; background:transparent; color:var(--text);
    font-family:'Noto Sans KR',sans-serif; display:inline-flex;
    align-items:center; justify-content:center; gap:6px; transition:all .15s;
  }
  .header {
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:16px 0 12px; border-bottom:1px solid var(--border);
  }
  .header-row { display:flex; align-items:center; justify-content:space-between; }
  input, textarea {
    width:100%; padding:10px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--bg);
    color:var(--text); font-size:14px; outline:none;
    font-family:'Noto Sans KR',sans-serif;
  }
  textarea { resize:vertical; line-height:1.7; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }
  .post-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:18px; margin-bottom:8px;
    cursor:pointer; transition:all .2s;
  }
  .post-card:hover { background:var(--card-hover); }
  .post-card.unread {
    background:var(--surface); border-color:rgba(108,92,231,0.2);
    border-left:3px solid var(--accent);
  }
  .tag {
    display:inline-flex; align-items:center; gap:4px;
    padding:5px 12px; border-radius:20px; font-size:13px;
    border:1px solid var(--border); cursor:pointer;
  }
  .tag.active { font-weight:600; }
  .tabs { display:flex; gap:4px; background:var(--surface); border-radius:10px; padding:3px; }
  .tab-btn {
    flex:1; padding:10px 0; border-radius:8px; font-size:13px;
    font-weight:400; color:var(--text-sec);
  }
  .tab-btn.active { background:var(--accent); color:#fff; font-weight:700; }
  .stats-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px; margin-bottom:24px;
  }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; text-align:center; }
  .stat-number { font-size:28px; font-weight:900; font-family:'Space Mono',monospace; }
  .bar-track { height:6px; background:var(--bg); border-radius:3px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:3px; transition:width .6s ease-out; }
  .reply-box {
    margin-top:10px; padding:10px 12px;
    background:rgba(108,92,231,0.07); border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0; font-size:13px; color:var(--accent-light); line-height:1.6;
  }
  .action-btn { padding:4px 10px; border-radius:6px; font-size:12px; gap:4px; }
  .role-card {
    width:200px; height:180px; flex-direction:column; gap:16px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
  }
  .role-card:hover { background:var(--surface-hover); }
  .rank-row {
    display:flex; align-items:center; gap:14px;
    padding:14px 12px; border-radius:10px; margin-bottom:6px;
  }
  .rank-row.top { background:rgba(108,92,231,0.05); border:1px solid rgba(108,92,231,0.13); }
  .conn-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .conn-dot.online { background:var(--green); box-shadow:0 0 6px var(--green); }
  .conn-dot.offline { background:var(--red); }
  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; padding:10px 24px;
    border-radius:10px; font-size:13px; font-weight:600;
    z-index:999; animation:fadeUp .3s ease-out;
    box-shadow:0 4px 20px rgba(108,92,231,0.4);
  }
  .toast.error { background:var(--red); }
  .hidden { display:none !important; }
  .student-row {
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-radius:10px; margin-bottom:4px; background:var(--card);
    border:1px solid var(--border);
  }
  .student-row:hover { background:var(--card-hover); }
  @media(max-width:480px){
    .role-card{width:160px;height:150px;}
    .stats-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<!-- ═══════════ ROLE SELECT ═══════════ -->
<div id="page-role" class="center-screen">
  <div class="fade-up" style="text-align:center;margin-bottom:8px;">
    <div style="font-size:48px;margin-bottom:12px;">📚</div>
    <h1 style="font-size:28px;font-weight:900;letter-spacing:-0.02em;
      background:linear-gradient(135deg,#a29bfe,#6c5ce7);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;">클래스 보이스</h1>
    <p style="color:var(--text-sec);margin-top:8px;font-size:14px;line-height:1.6;">수업 후 질문 · 건의 · 피드백을 남겨주세요</p>
    <div style="margin-top:12px;font-size:11px;color:var(--text-muted);">
      <span class="conn-dot" id="conn-dot"></span><span id="conn-text">연결 중...</span>
    </div>
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
    <button class="role-card fade-up" style="animation-delay:0.1s" onclick="goStudent()">
      <div style="font-size:40px">🎒</div>
      <div><div style="font-weight:700;font-size:16px;margin-bottom:4px;">학생</div>
      <div style="font-size:12px;color:var(--text-sec)">의견 남기기</div></div>
    </button>
    <button class="role-card fade-up" style="animation-delay:0.2s" onclick="showPwBox()">
      <div style="font-size:40px">👨‍🏫</div>
      <div><div style="font-weight:700;font-size:16px;margin-bottom:4px;">선생님</div>
      <div style="font-size:12px;color:var(--text-sec)">대시보드 보기</div></div>
    </button>
  </div>
  <div id="pw-box" class="hidden fade-up" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:320px;">
    <div style="font-size:13px;color:var(--text-sec);margin-bottom:12px;">선생님 비밀번호를 입력하세요</div>
    <div style="display:flex;gap:8px;">
      <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkPw()" style="font-family:'Space Mono',monospace;text-align:center;">
      <button onclick="checkPw()" style="padding:10px 20px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;">확인</button>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">기본 비밀번호: 1234</div>
  </div>
</div>

<!-- ═══════════ STUDENT LOGIN ═══════════ -->
<div id="page-student-login" class="center-screen hidden">
  <div class="fade-up panel" style="width:100%;max-width:380px;text-align:center;padding:32px;">
    <div style="font-size:36px;margin-bottom:12px;">🔐</div>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:4px;">학생 로그인</h2>
    <p style="font-size:13px;color:var(--text-sec);margin-bottom:24px;">선생님이 알려준 이름과 비밀번호를 입력하세요</p>
    <input id="login-name" placeholder="이름" style="text-align:center;margin-bottom:10px;font-size:15px;padding:12px 16px;">
    <input id="login-pw" type="password" placeholder="비밀번호" style="text-align:center;margin-bottom:6px;font-size:15px;padding:12px 16px;font-family:'Space Mono',monospace;"
      onkeydown="if(event.key==='Enter')studentLogin()">
    <div id="login-error" style="font-size:12px;color:var(--red);margin:8px 0;min-height:18px;"></div>
    <div style="display:flex;gap:8px;">
      <button onclick="showPage('page-role')" style="flex:1;padding:10px;border-radius:10px;background:var(--card);color:var(--text-sec);font-size:14px;">뒤로</button>
      <button onclick="studentLogin()" style="flex:2;padding:10px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;">로그인</button>
    </div>
  </div>
</div>

<!-- ═══════════ STUDENT COMPOSE ═══════════ -->
<div id="page-student" class="hidden">
  <div class="app">
    <div class="header">
      <div class="header-row">
        <button onclick="studentLogout()" style="color:var(--text-sec);font-size:13px;">← 로그아웃</button>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="conn-dot" id="conn-dot-s"></span>
          <div id="student-avatar" style="width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;"></div>
          <span id="student-name-display" style="font-size:14px;font-weight:600;"></span>
        </div>
      </div>
    </div>
    <div class="panel fade-up" style="margin-top:20px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:16px;">💬 의견 남기기</div>
      <div id="cat-buttons" style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;"></div>
      <textarea id="post-text" rows="4" placeholder="수업 중 이해가 안 됐던 부분이나 건의사항을 자유롭게 적어주세요..."></textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;">
        <button id="visibility-btn" onclick="toggleVisibility()" style="gap:6px;font-size:13px;padding:6px 12px;border-radius:8px;"></button>
        <button id="send-btn" onclick="submitPost()" style="gap:8px;padding:10px 22px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          보내기
        </button>
      </div>
    </div>
    <div id="public-posts" style="margin-top:32px;"></div>
  </div>
</div>

<!-- ═══════════ TEACHER VIEW ═══════════ -->
<div id="page-teacher" class="hidden">
  <div class="app">
    <div class="header">
      <div class="header-row" style="margin-bottom:12px;">
        <button onclick="showPage('page-role')" style="color:var(--text-sec);font-size:13px;">← 나가기</button>
        <div style="font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;">
          <span class="conn-dot" id="conn-dot-t"></span> 👨‍🏫 선생님 모드
        </div>
        <div style="width:60px"></div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-feed" onclick="switchTab('feed')">
          💬 피드 <span id="unread-badge" style="background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;"></span>
        </button>
        <button class="tab-btn" id="tab-dash" onclick="switchTab('dashboard')">📊 대시보드</button>
        <button class="tab-btn" id="tab-students" onclick="switchTab('students')">👥 학생관리</button>
      </div>
    </div>

    <!-- Feed -->
    <div id="section-feed" style="margin-top:16px;">
      <input id="search-input" placeholder="🔍 이름 또는 내용으로 검색..." oninput="renderFeed()" style="background:var(--surface);margin-bottom:10px;">
      <div id="filter-buttons" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;"></div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button onclick="markAllRead()" style="font-size:11px;color:var(--accent-light);padding:4px 10px;border-radius:6px;background:rgba(108,92,231,0.07);">모두 읽음 처리</button>
        <button onclick="clearAll()" style="font-size:11px;color:var(--red);padding:4px 10px;border-radius:6px;background:var(--red-dim);">전체 삭제</button>
      </div>
      <div id="feed-list"></div>
    </div>

    <!-- Dashboard -->
    <div id="section-dashboard" class="hidden" style="margin-top:20px;">
      <div id="stats-cards" class="stats-grid"></div>
      <div id="category-chart" class="panel" style="margin-bottom:16px;"></div>
      <div id="student-ranking" class="panel"></div>
    </div>

    <!-- Student Management -->
    <div id="section-students" class="hidden" style="margin-top:20px;">
      <div class="panel" style="margin-bottom:16px;">
        <div style="font-size:15px;font-weight:700;margin-bottom:16px;">➕ 학생 개별 추가</div>
        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <input id="add-student-name" placeholder="이름" style="flex:1;font-size:13px;">
          <input id="add-student-pw" placeholder="비밀번호" style="flex:1;font-size:13px;font-family:'Space Mono',monospace;">
          <button onclick="addStudent()" style="padding:8px 18px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;">추가</button>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:16px;">
          <div style="font-size:15px;font-weight:700;margin-bottom:8px;">📋 일괄 등록</div>
          <div style="font-size:12px;color:var(--text-sec);margin-bottom:8px;">한 줄에 <span style="color:var(--accent-light);font-family:'Space Mono',monospace;">이름,비밀번호</span> 형식으로 입력</div>
          <textarea id="bulk-input" rows="5" placeholder="예시:&#10;홍길동,1234&#10;김철수,5678&#10;이영희,abcd" style="font-size:13px;font-family:'Space Mono',monospace;"></textarea>
          <button onclick="bulkAddStudents()" style="margin-top:8px;padding:8px 18px;border-radius:8px;background:var(--green);color:#fff;font-size:13px;font-weight:600;">일괄 등록</button>
        </div>
      </div>
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div style="font-size:15px;font-weight:700;">📋 등록된 학생 (<span id="student-count">0</span>명)</div>
          <button onclick="deleteAllStudents()" style="font-size:11px;color:var(--red);padding:4px 10px;border-radius:6px;background:var(--red-dim);">전체 삭제</button>
        </div>
        <div id="student-list"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ═══════════ FIREBASE ═══════════
firebase.initializeApp({
  apiKey: "AIzaSyCZqg2U7-6kBtjnatGfPijvLH7AGlpYaFs",
  authDomain: "class-voice-909e6.firebaseapp.com",
  databaseURL: "https://class-voice-909e6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "class-voice-909e6",
  storageBucket: "class-voice-909e6.firebasestorage.app",
  messagingSenderId: "62347734220",
  appId: "1:62347734220:web:731353d78edf4758376669"
});
const db = firebase.database();
const postsRef = db.ref('posts');
const studentsRef = db.ref('students');

let isOnline = false;
db.ref('.info/connected').on('value', snap => {
  isOnline = !!snap.val();
  document.querySelectorAll('.conn-dot').forEach(d => d.className='conn-dot '+(isOnline?'online':'offline'));
  const t=document.getElementById('conn-text');
  if(t) t.textContent=isOnline?'실시간 연결됨':'연결 끊김';
});

// ═══════════ STATE ═══════════
const TEACHER_PW='1234';
const CATS=[
  {value:'question',label:'질문',emoji:'❓',color:'#6c5ce7'},
  {value:'suggestion',label:'건의',emoji:'💡',color:'#fdcb6e'},
  {value:'feedback',label:'피드백',emoji:'📝',color:'#00b894'},
  {value:'other',label:'기타',emoji:'💬',color:'#8b8b9e'},
];
let posts=[], students={}, studentName='', selectedCat='question', isPublic=false;
let currentFilter='all', currentCatFilter='all', currentTab='feed', replyingTo=null, currentPage='page-role';

function getCat(v){return CATS.find(c=>c.value===v)||CATS[3];}
function fmt(ts){const d=new Date(ts);return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' error':'');t.textContent=msg;document.getElementById('toast-container').appendChild(t);setTimeout(()=>t.remove(),2500);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ═══════════ REALTIME SYNC ═══════════
postsRef.on('value', snap=>{
  const d=snap.val();
  posts=d?Object.keys(d).map(k=>({...d[k],_key:k})).sort((a,b)=>b.timestamp-a.timestamp):[];
  if(currentPage==='page-student') renderPublicPosts();
  if(currentPage==='page-teacher'){renderFeed();renderDashboard();}
});
studentsRef.on('value', snap=>{
  students=snap.val()||{};
  if(currentPage==='page-teacher') renderStudentList();
});

// ═══════════ NAV ═══════════
function showPage(id){
  currentPage=id;
  ['page-role','page-student-login','page-student','page-teacher'].forEach(p=>
    document.getElementById(p).classList.toggle('hidden',p!==id));
}
function goStudent(){showPage('page-student-login');setTimeout(()=>document.getElementById('login-name').focus(),100);}
function showPwBox(){document.getElementById('pw-box').classList.remove('hidden');setTimeout(()=>document.getElementById('pw-input').focus(),100);}
function checkPw(){
  if(document.getElementById('pw-input').value===TEACHER_PW){
    document.getElementById('pw-input').value='';
    showPage('page-teacher');renderFeed();renderDashboard();renderStudentList();
  }
}

// ═══════════ STUDENT AUTH ═══════════
function studentLogin(){
  const name=document.getElementById('login-name').value.trim();
  const pw=document.getElementById('login-pw').value.trim();
  const err=document.getElementById('login-error');
  if(!name||!pw){err.textContent='이름과 비밀번호를 모두 입력하세요.';return;}
  const match=Object.values(students).find(s=>s.name===name&&s.password===pw);
  if(!match){err.textContent='이름 또는 비밀번호가 일치하지 않습니다.';return;}
  err.textContent='';
  studentName=name;
  document.getElementById('student-avatar').textContent=name[0];
  document.getElementById('student-name-display').textContent=name;
  document.getElementById('login-name').value='';
  document.getElementById('login-pw').value='';
  showPage('page-student');initStudentUI();renderPublicPosts();
  toast('✅ '+name+'님, 환영합니다!');
}
function studentLogout(){studentName='';showPage('page-role');}

// ═══════════ STUDENT UI ═══════════
function initStudentUI(){
  const w=document.getElementById('cat-buttons');w.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='tag'+(selectedCat===c.value?' active':'');
    b.style.color=selectedCat===c.value?c.color:'var(--text-sec)';
    b.style.background=selectedCat===c.value?c.color+'22':'transparent';
    b.style.borderColor=selectedCat===c.value?c.color+'44':'var(--border)';
    b.style.fontWeight=selectedCat===c.value?'600':'400';
    b.textContent=c.emoji+' '+c.label;
    b.onclick=()=>{selectedCat=c.value;initStudentUI();};
    w.appendChild(b);
  });
  updateVis();
}
function toggleVisibility(){isPublic=!isPublic;updateVis();}
function updateVis(){
  const b=document.getElementById('visibility-btn');
  if(isPublic){
    b.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> 공개';
    b.style.color='#00b894';b.style.background='var(--green-dim)';
  } else {
    b.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 비공개';
    b.style.color='#e17055';b.style.background='var(--red-dim)';
  }
}
function submitPost(){
  const text=document.getElementById('post-text').value.trim();
  if(!text)return;
  postsRef.push({id:Date.now().toString(),name:studentName,text,isPublic,category:selectedCat,timestamp:Date.now(),read:false,starred:false,reply:''})
    .then(()=>{document.getElementById('post-text').value='';toast('✅ 의견이 전송되었습니다!');})
    .catch(()=>toast('⚠️ 전송 실패',true));
}
function renderPublicPosts(){
  const w=document.getElementById('public-posts');if(!w)return;
  const pub=posts.filter(p=>p.isPublic);
  if(!pub.length){w.innerHTML='';return;}
  let h=`<div style="font-size:14px;font-weight:600;color:var(--text-sec);margin-bottom:12px;display:flex;align-items:center;gap:8px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> 공개된 의견 (${pub.length})</div>`;
  pub.forEach((p,i)=>{const c=getCat(p.category);
    h+=`<div class="post-card fade-up" style="animation-delay:${i*.05}s;cursor:default;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:12px;color:${c.color};font-weight:600;">${c.emoji} ${c.label}</span>
        <span style="font-size:11px;color:var(--text-muted);font-family:'Space Mono',monospace;">${fmt(p.timestamp)}</span></div>
      <div style="font-size:14px;line-height:1.7;white-space:pre-wrap;">${esc(p.text)}</div>
      ${p.reply?`<div class="reply-box" style="margin-top:10px;"><span style="font-weight:600;font-size:11px;">👨‍🏫 선생님 답변</span><div style="margin-top:4px;">${esc(p.reply)}</div></div>`:''}</div>`;
  });w.innerHTML=h;
}

// ═══════════ STUDENT MGMT ═══════════
function addStudent(){
  const n=document.getElementById('add-student-name').value.trim();
  const p=document.getElementById('add-student-pw').value.trim();
  if(!n||!p){toast('이름과 비밀번호를 모두 입력하세요',true);return;}
  if(Object.values(students).find(s=>s.name===n)){toast('이미 등록된 이름입니다',true);return;}
  studentsRef.push({name:n,password:p}).then(()=>{
    document.getElementById('add-student-name').value='';
    document.getElementById('add-student-pw').value='';
    toast('✅ '+n+' 학생 등록 완료');
  });
}
function bulkAddStudents(){
  const text=document.getElementById('bulk-input').value.trim();
  if(!text){toast('내용을 입력하세요',true);return;}
  const lines=text.split('\n').filter(l=>l.trim());
  let added=0,skipped=0;
  const existing=Object.values(students).map(s=>s.name);
  const updates={};
  lines.forEach(line=>{
    const parts=line.split(',').map(s=>s.trim());
    if(parts.length>=2&&parts[0]&&parts[1]){
      if(existing.includes(parts[0])){skipped++;return;}
      updates[studentsRef.push().key]={name:parts[0],password:parts[1]};
      existing.push(parts[0]);added++;
    } else skipped++;
  });
  if(Object.keys(updates).length>0){
    studentsRef.update(updates).then(()=>{
      document.getElementById('bulk-input').value='';
      toast(`✅ ${added}명 등록 완료`+(skipped?` (${skipped}명 건너뜀)`:''));
    });
  } else toast('등록할 학생이 없습니다',true);
}
function deleteStudent(key){const s=students[key];if(s&&confirm(s.name+' 학생을 삭제하시겠습니까?'))studentsRef.child(key).remove();}
function deleteAllStudents(){if(Object.keys(students).length&&confirm('등록된 모든 학생을 삭제하시겠습니까?'))studentsRef.remove();}
function resetPw(key){const pw=prompt('새 비밀번호를 입력하세요:');if(pw&&pw.trim()){studentsRef.child(key).update({password:pw.trim()});toast('✅ 비밀번호 변경됨');}}

function renderStudentList(){
  const list=document.getElementById('student-list'),cnt=document.getElementById('student-count');
  if(!list)return;
  const entries=Object.entries(students);
  cnt.textContent=entries.length;
  if(!entries.length){
    list.innerHTML=`<div style="text-align:center;padding:40px 0;color:var(--text-muted);">
      <div style="font-size:36px;margin-bottom:8px;">👥</div>
      <div style="font-size:14px;">등록된 학생이 없습니다</div>
      <div style="font-size:12px;margin-top:4px;">위에서 학생을 추가해주세요</div></div>`;return;
  }
  let h='';
  entries.sort((a,b)=>a[1].name.localeCompare(b[1].name,'ko')).forEach(([key,s],i)=>{
    const pc=posts.filter(p=>p.name===s.name).length;
    h+=`<div class="student-row slide-in" style="animation-delay:${i*.03}s;">
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6c5ce733,#00b89433);
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--accent-light);">${esc(s.name[0])}</div>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:600;">${esc(s.name)}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">
          비밀번호: <span style="font-family:'Space Mono',monospace;color:var(--text-sec);">${esc(s.password)}</span> · 의견 ${pc}건</div>
      </div>
      <button onclick="resetPw('${key}')" style="padding:4px 8px;border-radius:6px;font-size:11px;color:var(--accent-light);background:rgba(108,92,231,0.07);" title="비밀번호 변경">🔑</button>
      <button onclick="deleteStudent('${key}')" style="padding:4px 8px;border-radius:6px;font-size:11px;color:var(--red);background:var(--red-dim);" title="삭제">✕</button>
    </div>`;
  });list.innerHTML=h;
}

// ═══════════ TEACHER FEED ═══════════
function switchTab(tab){
  currentTab=tab;
  ['feed','dash','students'].forEach(t=>document.getElementById('tab-'+t).className='tab-btn'+((t==='dash'?'dashboard':t)===tab||t===tab?' active':''));
  document.getElementById('tab-feed').className='tab-btn'+(tab==='feed'?' active':'');
  document.getElementById('tab-dash').className='tab-btn'+(tab==='dashboard'?' active':'');
  document.getElementById('tab-students').className='tab-btn'+(tab==='students'?' active':'');
  document.getElementById('section-feed').classList.toggle('hidden',tab!=='feed');
  document.getElementById('section-dashboard').classList.toggle('hidden',tab!=='dashboard');
  document.getElementById('section-students').classList.toggle('hidden',tab!=='students');
  if(tab==='dashboard')renderDashboard();if(tab==='students')renderStudentList();
}

function renderFeed(){
  const search=(document.getElementById('search-input')?.value||'').toLowerCase();
  let f=[...posts];
  if(currentFilter==='unread')f=f.filter(p=>!p.read);
  if(currentFilter==='starred')f=f.filter(p=>p.starred);
  if(currentCatFilter!=='all')f=f.filter(p=>p.category===currentCatFilter);
  if(search)f=f.filter(p=>p.text.toLowerCase().includes(search)||p.name.toLowerCase().includes(search));

  const unread=posts.filter(p=>!p.read).length;
  const badge=document.getElementById('unread-badge');
  if(badge){badge.textContent=unread>0?unread:'';badge.style.display=unread>0?'inline':'none';}

  const fb=document.getElementById('filter-buttons');if(!fb)return;
  let fh='';
  [{id:'all',l:'전체'},{id:'unread',l:`안 읽음 (${unread})`},{id:'starred',l:'⭐ 중요'}].forEach(x=>{
    const a=currentFilter===x.id;
    fh+=`<button onclick="currentFilter='${x.id}';renderFeed()" class="tag${a?' active':''}"
      style="font-size:12px;padding:5px 12px;border-radius:8px;
      color:${a?'var(--accent-light)':'var(--text-sec)'};
      background:${a?'rgba(108,92,231,0.13)':'transparent'};
      border-color:${a?'rgba(108,92,231,0.26)':'transparent'};">${x.l}</button>`;
  });
  fh+=`<div style="width:1px;height:16px;background:var(--border);margin:0 4px;"></div>`;
  [{v:'all',l:'전체'},...CATS.map(c=>({v:c.value,l:c.emoji}))].forEach(c=>{
    const a=currentCatFilter===c.v;
    fh+=`<button onclick="currentCatFilter='${c.v}';renderFeed()"
      style="padding:5px 10px;border-radius:8px;font-size:12px;border:none;
      background:${a?'var(--surface)':'transparent'};color:${a?'var(--text)':'var(--text-muted)'};">${c.l}</button>`;
  });fb.innerHTML=fh;

  const list=document.getElementById('feed-list');if(!list)return;
  if(!f.length){list.innerHTML=`<div style="text-align:center;padding:60px 0;color:var(--text-muted);"><div style="font-size:40px;margin-bottom:12px;">📭</div><div style="font-size:14px;">아직 의견이 없습니다</div></div>`;return;}

  let h='';
  f.forEach((p,i)=>{const c=getCat(p.category),k=p._key||'';
    h+=`<div class="post-card fade-up ${p.read?'':'unread'}" style="animation-delay:${i*.03}s" onclick="markRead('${k}')">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,${c.color}44,${c.color}22);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:${c.color};">${esc(p.name[0])}</div>
          <div><div style="font-size:14px;font-weight:600;">${esc(p.name)}</div>
            <div style="display:flex;gap:8px;align-items:center;margin-top:2px;">
              <span style="font-size:11px;color:${c.color};">${c.emoji} ${c.label}</span>
              <span style="font-size:10px;padding:1px 7px;border-radius:4px;background:${p.isPublic?'var(--green-dim)':'var(--red-dim)'};color:${p.isPublic?'#00b894':'#e17055'};">${p.isPublic?'공개':'비공개'}</span></div></div></div>
        <div style="display:flex;align-items:center;gap:4px;">
          ${!p.read?'<div style="width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;"></div>':''}
          <span style="font-size:11px;color:var(--text-muted);font-family:'Space Mono',monospace;">${fmt(p.timestamp)}</span></div></div>
      <div style="font-size:14px;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;">${esc(p.text)}</div>
      ${p.reply?`<div class="reply-box" style="margin-bottom:10px;"><span style="font-weight:600;font-size:11px;">✅ 내 답변</span><div style="margin-top:4px;">${esc(p.reply)}</div></div>`:''}
      <div style="display:flex;gap:6px;" onclick="event.stopPropagation()">
        <button class="action-btn" onclick="toggleStar('${k}')" style="color:${p.starred?'var(--orange)':'var(--text-muted)'};background:${p.starred?'var(--orange-dim)':'transparent'};">⭐ ${p.starred?'중요':'표시'}</button>
        <button class="action-btn" onclick="startReply('${k}')" style="color:var(--accent-light);background:rgba(108,92,231,0.07);">↩ 답변</button>
        <button class="action-btn" onclick="deletePost('${k}')" style="color:var(--red);background:var(--red-dim);">🗑 삭제</button></div>
      <div id="reply-area-${k}" class="hidden" onclick="event.stopPropagation()" style="margin-top:12px;display:flex;gap:8px;">
        <input id="reply-input-${k}" placeholder="답변을 입력하세요..." onkeydown="if(event.key==='Enter')sendReply('${k}')" style="flex:1;padding:8px 12px;border-radius:8px;font-size:13px;">
        <button onclick="sendReply('${k}')" style="padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;">전송</button></div></div>`;
  });list.innerHTML=h;

  if(replyingTo){const area=document.getElementById('reply-area-'+replyingTo);
    if(area){area.classList.remove('hidden');area.style.display='flex';
      const inp=document.getElementById('reply-input-'+replyingTo);
      const p=posts.find(x=>x._key===replyingTo);
      if(inp&&p)inp.value=p.reply||'';setTimeout(()=>inp?.focus(),50);}}
}

function markRead(k){if(!k)return;const p=posts.find(x=>x._key===k);if(p&&!p.read)postsRef.child(k).update({read:true});}
function toggleStar(k){const p=posts.find(x=>x._key===k);if(p)postsRef.child(k).update({starred:!p.starred});}
function deletePost(k){if(k)postsRef.child(k).remove();}
function markAllRead(){posts.forEach(p=>{if(!p.read&&p._key)postsRef.child(p._key).update({read:true});});}
function clearAll(){if(posts.length&&confirm('정말 전체 삭제하시겠습니까?'))postsRef.remove();}
function startReply(k){replyingTo=replyingTo===k?null:k;renderFeed();}
function sendReply(k){const inp=document.getElementById('reply-input-'+k);if(!inp||!inp.value.trim())return;postsRef.child(k).update({reply:inp.value.trim()});replyingTo=null;toast('✅ 답변 등록됨');}

// ═══════════ DASHBOARD ═══════════
function renderDashboard(){
  const unread=posts.filter(p=>!p.read).length;
  const sm={};
  posts.forEach(p=>{if(!sm[p.name])sm[p.name]={total:0,question:0,suggestion:0,feedback:0,other:0};sm[p.name].total++;sm[p.name][p.category]++;});
  const sorted=Object.entries(sm).sort((a,b)=>b[1].total-a[1].total);
  const tc={question:0,suggestion:0,feedback:0,other:0};
  posts.forEach(p=>tc[p.category]++);

  const sc=document.getElementById('stats-cards');if(!sc)return;
  sc.innerHTML=[
    {l:'총 의견',v:posts.length,c:'#6c5ce7',e:'📊'},
    {l:'안 읽음',v:unread,c:'#e17055',e:'🔴'},
    {l:'참여 학생',v:Object.keys(sm).length,c:'#00b894',e:'👥'},
    {l:'공개 글',v:posts.filter(p=>p.isPublic).length,c:'#fdcb6e',e:'🌐'}
  ].map((s,i)=>`<div class="stat-card count-up" style="animation-delay:${i*.08}s;"><div style="font-size:24px;margin-bottom:6px;">${s.e}</div><div class="stat-number" style="color:${s.c};">${s.v}</div><div style="font-size:12px;color:var(--text-sec);margin-top:4px;">${s.l}</div></div>`).join('');

  let ch=`<div style="font-size:15px;font-weight:700;margin-bottom:16px;">📈 유형별 분포</div>`;
  CATS.forEach(cat=>{const count=tc[cat.value],pct=posts.length?(count/posts.length)*100:0;
    ch+=`<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:13px;">${cat.emoji} ${cat.label}</span><span style="font-size:13px;color:${cat.color};font-weight:700;font-family:'Space Mono',monospace;">${count}건 (${Math.round(pct)}%)</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${cat.color};"></div></div></div>`;
  });document.getElementById('category-chart').innerHTML=ch;

  let rh=`<div style="font-size:15px;font-weight:700;margin-bottom:16px;">🏆 학생별 참여 현황</div>`;
  if(!sorted.length)rh+=`<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:14px;">아직 데이터가 없습니다</div>`;
  sorted.forEach(([name,st],i)=>{
    const bg=['#6c5ce7','#00b89433','#fdcb6e33','var(--card)'],fg=['#fff','#00b894','#fdcb6e','var(--text-sec)'];
    rh+=`<div class="rank-row slide-in ${i===0?'top':''}" style="animation-delay:${i*.06}s;">
      <div style="width:28px;height:28px;border-radius:50%;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;background:${bg[Math.min(i,3)]};color:${fg[Math.min(i,3)]};font-family:'Space Mono',monospace;">${i+1}</div>
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6c5ce733,#00b89433);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--accent-light);">${esc(name[0])}</div>
      <div style="flex:1;"><div style="font-size:14px;font-weight:600;">${esc(name)}</div>
        <div style="display:flex;gap:8px;margin-top:3px;">${CATS.map(c=>st[c.value]?`<span style="font-size:11px;color:${c.color};">${c.emoji}${st[c.value]}</span>`:'').join('')}</div></div>
      <div style="text-align:right;"><div style="font-size:22px;font-weight:900;font-family:'Space Mono',monospace;">${st.total}</div><div style="font-size:10px;color:var(--text-muted);">총 의견</div></div></div>`;
  });document.getElementById('student-ranking').innerHTML=rh;
}
</script>
